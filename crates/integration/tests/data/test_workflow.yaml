---
name: "Run Mnemos locally with shell"
command: "MNEMOS_SHELL_PATH={{shell}} cargo run"
description: "Runs mnemos with the particular shell so devs don't need to change their login shell to test a different shell locally"
arguments:
  - name: shell
    description: path of shell to use
author: Mnemos Team
shells: []
