[package]
name = "mnemos_completer"
authors.workspace = true
version = "0.1.0"
edition = "2021"
description = "Mnemos completions engine"
publish.workspace = true
license.workspace = true

[dependencies]
async-recursion.workspace = true
async-trait.workspace = true
anyhow.workspace = true
bincode.workspace = true
clap.workspace = true
derive-new = "0.5.8"
dirs.workspace = true
futures.workspace = true
fuzzy_match.workspace = true
getset.workspace = true
instant.workspace = true
itertools.workspace = true
lazy_static.workspace = true
log.workspace = true
memo-map.workspace = true
regex.workspace = true
serde.workspace = true
shellexpand.workspace = true
smol_str.workspace = true
string-offset.workspace = true
thiserror.workspace = true
mnemos_cli.workspace = true
mnemos_core.workspace = true
mnemos_ui.workspace = true
mnemos_util.workspace = true
typed-path.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# For wasm, we don't use the feature "embed-signatures".
warp-command-signatures = {workspace = true}

[target.'cfg(not(target_family = "wasm"))'.dependencies]
command = { path = "../command" }
warp-command-signatures = {workspace = true, features = ["embed-signatures"]}

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
command = { path = "../command", features = ["test-util"] }

[dev-dependencies]
anyhow.workspace = true
# Enable the `test-util` feature for our own package when running tests.
mnemos_completer = { path = ".", features = ["test-util"] }
# Mnemos IDE: the tests build the CLI's clap command, which reads feature flags. Nothing in a
# crate-scoped test run initializes them, so use the test-util flags (a workspace run unifies
# this feature on anyway).
mnemos_features = { workspace = true, features = ["test-util"] }

[features]
# Enables utilities for testing.
test-util = []
